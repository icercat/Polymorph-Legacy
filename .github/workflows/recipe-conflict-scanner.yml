name: Build Recipe Conflict Scanner

on:
  push:
    branches:
      - feature/recipe-conflict-scanner
    paths:
      - 'tools/RecipeConflictScanner/**'
      - '.github/workflows/recipe-conflict-scanner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8 toolchain and Java 21 build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Install Gradle 8.11.1
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt

      - name: Build
        working-directory: tools/RecipeConflictScanner
        run: /opt/gradle-8.11.1/bin/gradle --no-daemon --console=plain clean build

      - name: List outputs
        run: find tools/RecipeConflictScanner/build/libs -maxdepth 1 -type f -printf '%f\n'

      - name: Test snapshot worker isolation and cancellation
        working-directory: tools/RecipeConflictScanner
        run: |
          mkdir -p build/snapshot-tests
          "$JAVA_HOME_8_X64/bin/javac" -d build/snapshot-tests src/main/java/dev/frostey/recipeconflicts/SnapshotMatcher.java tests/SnapshotMatcherTest.java
          "$JAVA_HOME_8_X64/bin/java" -cp build/snapshot-tests dev.frostey.recipeconflicts.SnapshotMatcherTest

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RecipeConflictScanner-server
          path: |
            tools/RecipeConflictScanner/build/libs/*.jar
            tools/RecipeConflictScanner/build/libs/*.sha256
          if-no-files-found: error
