name: Build Recipe Conflict Scanner

on:
  push:
    branches:
      - feature/recipe-conflict-scanner
    paths:
      - 'tools/RecipeConflictScanner/**'
      - '.github/workflows/recipe-conflict-scanner.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt

      - name: Build
        working-directory: tools/RecipeConflictScanner
        run: /opt/gradle-8.11.1/bin/gradle --no-daemon clean build

      - name: List outputs
        run: find tools/RecipeConflictScanner/build/libs -maxdepth 1 -type f -printf '%f\n'

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RecipeConflictScanner-0.1.0-exp1
          path: tools/RecipeConflictScanner/build/libs/*.jar
          if-no-files-found: error
